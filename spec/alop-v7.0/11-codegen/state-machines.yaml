  # in FAILED/UNKNOWN/CLOSED/EXPIRED; success flows through USER_PAYING or out
  # of UNKNOWN via callback/query evidence. USER_PAYING and EXPIRED are now
  # first-class states (also frozen in 04-openapi/payment.yaml
  # PaymentAttemptView.status). UNKNOWN self-loop = query stays uncertain.
  PaymentAttempt:
    initial: INITIATED
    transitions:
    - - INITIATED
