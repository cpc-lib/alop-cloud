  # decision: PaymentOrder is the money-safety critical machine.
  # - CLOSED -> SUCCESS (recordLateSuccess) is mandatory: MASTER-SPEC-V7.0 §17.6
  #   and payment/DOMAIN-SPEC.md §16 (late provider success must never drop a
  #   real money fact; only the dedicated command may perform this transition).
  # - No order-level UNKNOWN state: payment/STATE-MACHINE.md explicitly keeps
  #   provider uncertainty on PaymentAttempt / RefundOrder; the read model
  #   reports processingState=UNKNOWN while the order stays PAYING.
  # - FAILED kept as internal terminal state per approved fix plan (OpenAPI
  #   PaymentOrderView.status simply does not expose it).
  # - close unified into one command name (covers provider-confirmed close and
  #   all-attempts-failed-and-expired close; guards live in the domain layer).
  # - PARTIALLY_REFUNDED self-loop: multiple partial refunds accumulate.
  PaymentOrder:
    initial: CREATED
    transitions:
    - - CREATED
      - startPaying
      - PAYING
    - - PAYING
      - verifiedCallback
      - SUCCESS
    - - PAYING
      - failFinal
      - FAILED
    - - CREATED
      - close
      - CLOSED
    - - PAYING
      - close
      - CLOSED
    - - CLOSED
      - recordLateSuccess
      - SUCCESS
    - - SUCCESS
      - partialRefund
      - PARTIALLY_REFUNDED
    - - PARTIALLY_REFUNDED
      - partialRefund
      - PARTIALLY_REFUNDED
    - - SUCCESS
      - fullRefund
      - REFUNDED
    - - PARTIALLY_REFUNDED
      - fullRefund
      - REFUNDED
