      - EXPIRED
    - - INITIATED
      - close
      - CLOSED
    - - PREPAY_CREATED
      - clientLaunched
      - USER_PAYING
    - - PREPAY_CREATED
      - providerFail
      - FAILED
    - - PREPAY_CREATED
      - uncertain
      - UNKNOWN
    - - PREPAY_CREATED
      - expire
      - EXPIRED
    - - PREPAY_CREATED
      - close
      - CLOSED
    - - USER_PAYING
      - paidCallback
      - SUCCESS
    - - USER_PAYING
      - querySuccess
      - SUCCESS
    - - USER_PAYING
      - queryFail
      - FAILED
    - - USER_PAYING
      - queryUncertain
      - UNKNOWN
    - - USER_PAYING
      - expire
      - EXPIRED
    - - USER_PAYING
      - close
      - CLOSED
    - - UNKNOWN
