# =============================================================================
# ALOP-SaaS V7.0 State Machines - CANONICAL SOURCE (frozen codegen contract)
# -----------------------------------------------------------------------------
# This file is the single canonical source of truth for aggregate state
# machines. Domain STATE-MACHINE.md files must stay consistent with this file.
# Conflict resolution precedence:
#   1. 11-codegen/state-machines.yaml  (this file, canonical)
#   2. 02-domain/*/DOMAIN-SPEC.md
#   3. 02-domain/*/STATE-MACHINE.md    (domain draft)
# Any change to a machine below requires an ADR and must be mirrored into the
# corresponding domain STATE-MACHINE.md and 11-codegen/STATE-MACHINE-CATALOG.md
# in the same change.
# Conventions:
#   - States: UPPER_SNAKE_CASE; externally exposed state names must match the
#     frozen 04-openapi enums where such enums exist.
#   - Transition triggers: lowerCamelCase imperative commands. Transitions that
#     consume integration events use the eventType naming of
#     05-events/event-registry.yaml (dotted + v1).
#   - `# decision:` comments record how spec-source conflicts were resolved.
# =============================================================================
