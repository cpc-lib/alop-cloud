openapi: 3.0.3
info:
  title: ALOP Reservation API
  version: 7.0.0
  description: Reservation lifecycle APIs owned by the alop-reservation service (per
    ADR-023). Covers create, confirm, cancel, commit, release and expire transitions
    over resource inventory guarded by ScheduleGuard.
servers:
- url: /
paths:
  /api/admin/v1/reservations:
    get:
      summary: List reservations
      parameters:
      - in: query
        name: customerId
        schema:
          type: integer
          format: int64
      - in: query
        name: status
        schema:
          type: string
      - in: query
        name: pageNo
        schema:
          type: integer
          minimum: 1
      - in: query
        name: pageSize
        schema:
          type: integer
          minimum: 1
          maximum: 200
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validation/domain request error
        '403':
          description: Permission or tenant access denied
        '409':
          description: State/idempotency/concurrency conflict
        '500':
          description: Unexpected system error
      operationId: getReservations
      x-alop-tenant-scoped: true
    post:
      summary: Create reservation
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validation/domain request error
        '403':
          description: Permission or tenant access denied
        '409':
          description: State/idempotency/concurrency conflict
        '500':
          description: Unexpected system error
      operationId: postReservations
      x-alop-tenant-scoped: true
      x-alop-command: true
  /api/admin/v1/reservations/{reservationId}:
    get:
      summary: Get reservation detail
      parameters:
      - in: path
        name: reservationId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validation/domain request error
        '403':
          description: Permission or tenant access denied
        '409':
          description: State/idempotency/concurrency conflict
        '500':
          description: Unexpected system error
      operationId: getReservationsReservationId
      x-alop-tenant-scoped: true
  /api/admin/v1/reservations/{reservationId}/confirm:
    post:
      summary: Confirm reservation
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
      - in: path
        name: reservationId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmReservationRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validation/domain request error
        '403':
          description: Permission or tenant access denied
        '409':
          description: State/idempotency/concurrency conflict
        '500':
          description: Unexpected system error
      operationId: postReservationsReservationIdConfirm
      x-alop-tenant-scoped: true
      x-alop-command: true
  /api/admin/v1/reservations/{reservationId}/cancel:
    post:
      summary: Cancel reservation
      description: Releases reserved inventory. Forbidden once reservation is COMMITTED
        or CONVERTED.
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
      - in: path
        name: reservationId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelReservationRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validation/domain request error
        '403':
          description: Permission or tenant access denied
        '409':
          description: State/idempotency/concurrency conflict
        '500':
          description: Unexpected system error
      operationId: postReservationsReservationIdCancel
      x-alop-tenant-scoped: true
      x-alop-command: true
  /api/admin/v1/reservations/{reservationId}/release:
    post:
      summary: Release committed reservation back to available inventory
      description: Used when an agreement creation is rolled back after CommitReservation.
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
      - in: path
        name: reservationId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseReservationRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validation/domain request error
        '403':
          description: Permission or tenant access denied
        '409':
          description: State/idempotency/concurrency conflict
        '500':
          description: Unexpected system error
      operationId: postReservationsReservationIdRelease
      x-alop-tenant-scoped: true
      x-alop-command: true
  /internal/v1/reservations/{reservationId}/commit:
    post:
      summary: Commit reservation for agreement
      description: Internal service-to-service endpoint called by Agreement Service
        after agreement creation. Converts reservation into occupancy.
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
      - in: path
        name: reservationId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitReservationRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validation/domain request error
        '403':
          description: Permission or tenant access denied
        '409':
          description: State/idempotency/concurrency conflict
        '500':
          description: Unexpected system error
      operationId: postReservationsReservationIdCommit
      x-alop-tenant-scoped: true
      x-alop-command: true
  /internal/v1/reservations/{reservationId}/expire:
    post:
      summary: Expire reservation past its hold deadline
      description: Internal job trigger. ReservationExpireJob is the authoritative
        expiry transition; late successful deposit after expiry creates an ORPHAN_RESERVATION_PAYMENT
        task and never auto-reactivates.
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
      - in: path
        name: reservationId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpireReservationRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validation/domain request error
        '403':
          description: Permission or tenant access denied
        '409':
          description: State/idempotency/concurrency conflict
        '500':
          description: Unexpected system error
      operationId: postReservationsReservationIdExpire
      x-alop-tenant-scoped: true
      x-alop-command: true
components:
  schemas:
    ApiResponse:
      type: object
      required:
      - code
      - message
      - traceId
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
        data: {}
    ReservationItemRequest:
      type: object
      required:
      - resourceUnitId
      - offeringId
      - startTime
      - endTime
      properties:
        resourceUnitId:
          type: integer
          format: int64
        offeringId:
          type: integer
          format: int64
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
    CreateReservationRequest:
      type: object
      required:
      - customerId
      - quotationVersionId
      - items
      properties:
        customerId:
          type: integer
          format: int64
        opportunityId:
          type: integer
          format: int64
        quotationVersionId:
          type: integer
          format: int64
        holdMinutes:
          type: integer
          minimum: 1
          maximum: 10080
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ReservationItemRequest'
    ConfirmReservationRequest:
      type: object
      properties:
        paymentOrderId:
          type: integer
          format: int64
    CancelReservationRequest:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 512
        version:
          type: integer
          minimum: 0
    ReleaseReservationRequest:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 512
        version:
          type: integer
          minimum: 0
    CommitReservationRequest:
      type: object
      required:
      - agreementId
      - requestId
      properties:
        agreementId:
          type: integer
          format: int64
        requestId:
          type: string
    ExpireReservationRequest:
      type: object
      required:
      - requestId
      properties:
        requestId:
          type: string
          minLength: 8
          maxLength: 128
          description: Idempotent trigger key from ReservationExpireJob.
