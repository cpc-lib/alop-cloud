openapi: 3.0.3
info:
  title: ALOP Asset API
  version: 7.0.0
  description: Asset, resource and inventory availability APIs owned by alop-asset.
    Reservation lifecycle APIs were moved to reservation.yaml per ADR-023 (alop-reservation
    is an independent service).
servers:
- url: /
paths:
  /api/admin/v1/assets:
    post:
      summary: Create asset
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssetRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validation/domain request error
        '403':
          description: Permission or tenant access denied
        '409':
          description: State/idempotency/concurrency conflict
        '500':
          description: Unexpected system error
      operationId: postAssets
      x-alop-tenant-scoped: true
      x-alop-command: true
  /api/admin/v1/assets/{assetId}/submit:
    post:
      summary: Submit asset
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validation/domain request error
        '403':
          description: Permission or tenant access denied
        '409':
          description: State/idempotency/concurrency conflict
        '500':
          description: Unexpected system error
      parameters:
      - in: path
        name: assetId
        required: true
        schema:
          type: integer
          format: int64
      operationId: postAssetsAssetIdSubmit
      x-alop-tenant-scoped: true
      x-alop-command: true
  /api/admin/v1/resources:
    post:
      summary: Create resource
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResourceRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validation/domain request error
        '403':
          description: Permission or tenant access denied
        '409':
          description: State/idempotency/concurrency conflict
        '500':
          description: Unexpected system error
      operationId: postResources
      x-alop-tenant-scoped: true
      x-alop-command: true
  /api/admin/v1/resources/{resourceId}/availability:
    get:
      summary: Check availability
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validation/domain request error
        '403':
          description: Permission or tenant access denied
        '409':
          description: State/idempotency/concurrency conflict
        '500':
          description: Unexpected system error
      parameters:
      - in: path
        name: resourceId
        required: true
        schema:
          type: integer
          format: int64
      operationId: getResourcesResourceIdAvailability
      x-alop-tenant-scoped: true
  /api/admin/v1/parking-spaces/{resourceId}/availability:
    get:
      summary: Check parking space availability using common ScheduleGuard inventory
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validation/domain request error
        '403':
          description: Permission or tenant access denied
        '409':
          description: State/idempotency/concurrency conflict
        '500':
          description: Unexpected system error
      parameters:
      - in: path
        name: resourceId
        required: true
        schema:
          type: integer
          format: int64
      operationId: getParkingSpacesResourceIdAvailability
      x-alop-tenant-scoped: true
components:
  schemas:
    ApiResponse:
      type: object
      required:
      - code
      - message
      - traceId
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
        data: {}
    CreateAssetRequest:
      type: object
      required:
      - assetCode
      - assetName
      - assetType
      - ownershipType
      - operationMode
      properties:
        assetCode:
          type: string
        assetName:
          type: string
        assetType:
          type: string
        ownershipType:
          type: string
        operationMode:
          type: string
        address:
          type: string
    CreateResourceRequest:
      type: object
      required:
      - assetId
      - resourceCode
      - resourceName
      - resourceType
      properties:
        assetId:
          type: integer
          format: int64
        spaceId:
          type: integer
          format: int64
        resourceCode:
          type: string
        resourceName:
          type: string
        resourceType:
          type: string
        rentable:
          type: boolean
          default: true
        sellable:
          type: boolean
          default: false

