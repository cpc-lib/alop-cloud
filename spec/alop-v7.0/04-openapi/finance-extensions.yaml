openapi: 3.0.3
info:
  title: ALOP Finance Enterprise Extensions API
  version: 7.0.0
servers:
- url: /
paths:
  /api/admin/v1/security-deposits/{agreementId}:
    get:
      operationId: getSecurityDeposit
      x-alop-tenant-scoped: true
      parameters:
      - name: agreementId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses: &id001
        '200':
          description: success
        '400':
          description: validation/domain error
        '403':
          description: forbidden
        '409':
          description: conflict
        '500':
          description: system error
  /api/admin/v1/security-deposits/{agreementId}/settle:
    post:
      operationId: settleSecurityDeposit
      x-alop-tenant-scoped: true
      x-alop-command: true
      parameters:
      - name: agreementId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettleDepositRequest'
      responses: *id001
  /api/admin/v1/finance/unidentified-collections:
    get:
      operationId: listUnidentifiedCollections
      x-alop-tenant-scoped: true
      parameters:
      - name: status
        in: query
        schema:
          type: string
      - name: pageNo
        in: query
        schema:
          type: integer
          minimum: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
      responses: *id001
  /api/admin/v1/finance/unidentified-collections/{id}/claim:
    post:
      operationId: claimUnidentifiedCollection
      x-alop-tenant-scoped: true
      x-alop-command: true
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimUnidentifiedCollectionRequest'
      responses: *id001
  /api/admin/v1/finance/unidentified-collections/{id}/refund:
    post:
      operationId: refundUnidentifiedCollection
      x-alop-tenant-scoped: true
      x-alop-command: true
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundUnidentifiedCollectionRequest'
      responses: *id001
  /api/admin/v1/finance/unidentified-collections/{id}/reopen:
    post:
      operationId: reopenUnidentifiedCollection
      x-alop-tenant-scoped: true
      x-alop-command: true
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReopenUnidentifiedCollectionRequest'
      responses: *id001
  /api/admin/v1/finance/security-deposits/{id}/deduct:
    post:
      operationId: deductSecurityDeposit
      x-alop-tenant-scoped: true
      x-alop-command: true
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeductSecurityDepositRequest'
      responses: *id001
  /api/admin/v1/finance/security-deposits/{id}/refund:
    post:
      operationId: refundSecurityDeposit
      x-alop-tenant-scoped: true
      x-alop-command: true
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundSecurityDepositRequest'
      responses: *id001
components:
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
  schemas:
    ApiResponse:
      type: object
      required:
      - code
      - message
      - traceId
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
        data: {}
    SettleDepositRequest:
      type: object
      required:
      - version
      properties:
        version:
          type: integer
        deductions:
          type: array
          items:
            type: object
            required:
            - receivableId
            - amount
            properties:
              receivableId:
                type: integer
                format: int64
              amount:
                type: string
                pattern: ^\d+(\.\d{1,2})?$
        refundRemaining:
          type: boolean
          default: true
        reason:
          type: string
    ClaimUnidentifiedCollectionRequest:
      type: object
      required:
      - customerId
      - claimReason
      properties:
        customerId:
          type: integer
          format: int64
        agreementId:
          type: integer
          format: int64
        allocationTargets:
          type: array
          items:
            type: object
            required:
            - receivableId
            - amount
            properties:
              receivableId:
                type: integer
                format: int64
              amount:
                type: string
                pattern: ^\d+(\.\d{1,2})?$
        claimReason:
          type: string
          maxLength: 512
        version:
          type: integer
    RefundUnidentifiedCollectionRequest:
      type: object
      required:
      - amount
      - reason
      - version
      properties:
        amount:
          type: string
          pattern: ^\d+(\.\d{1,2})?$
        reason:
          type: string
          maxLength: 512
        version:
          type: integer
    ReopenUnidentifiedCollectionRequest:
      type: object
      required:
      - reason
      - version
      properties:
        reason:
          type: string
          maxLength: 512
        version:
          type: integer
    DeductSecurityDepositRequest:
      type: object
      required:
      - receivableId
      - amount
      - reason
      - version
      properties:
        receivableId:
          type: integer
          format: int64
        amount:
          type: string
          pattern: ^\d+(\.\d{1,2})?$
        reason:
          type: string
          maxLength: 512
        version:
          type: integer
    RefundSecurityDepositRequest:
      type: object
      required:
      - amount
      - reason
      - version
      properties:
        amount:
          type: string
          pattern: ^\d+(\.\d{1,2})?$
        reason:
          type: string
          maxLength: 512
        version:
          type: integer
