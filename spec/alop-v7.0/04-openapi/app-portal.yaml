      tags:
      - AppInvoice
      summary: Apply for an invoice
      operationId: applyInvoice
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppInvoiceApplicationRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
