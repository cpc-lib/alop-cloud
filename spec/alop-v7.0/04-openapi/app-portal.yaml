      tags:
      - AppNotification
      summary: List my in-app notifications
      operationId: listMyNotifications
      parameters:
      - name: unreadOnly
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponseBase'
                - type: object
                  properties:
                    data:
                      type: array
