  /api/app/v1/bills/{billId}:
    get:
      tags:
      - AppBill
      summary: Get my bill detail
      operationId: getMyBill
      parameters:
      - name: billId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
