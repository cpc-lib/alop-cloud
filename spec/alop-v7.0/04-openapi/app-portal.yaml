        '500':
          description: Unexpected system error
      x-alop-tenant-scoped: true
  /api/app/v1/reservations/{reservationId}/cancel:
    post:
      tags:
      - AppReservation
      summary: Cancel my reservation before confirmation
      operationId: cancelMyReservation
      parameters:
      - name: reservationId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelMyReservationRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBase'
        '400':
          description: Validation/domain request error
        '403':
          description: Permission or tenant access denied
        '409':
          description: State/idempotency/concurrency conflict
        '500':
          description: Unexpected system error
      x-alop-tenant-scoped: true
      x-alop-command: true
  /api/app/v1/agreements/me:
    get:
      tags:
      - AppAgreement
      summary: List my agreements
      operationId: listMyAgreements
      responses:
        '200':
          description: success
