openapi: 3.0.3
info:
  title: ALOP App Portal API
  version: 7.0.0
  description: Customer-facing (UniApp) portal API owned by alop-app-portal. All
    endpoints are scoped to the authenticated customer and tenant resolved from
    the WeChat mini-program session.
servers:
- url: /
tags:
- name: AppAuth
- name: AppProfile
- name: AppResource
- name: AppViewing
- name: AppQuotation
- name: AppReservation
- name: AppAgreement
- name: AppHandover
- name: AppBill
- name: AppInvoice
- name: AppNotification
- name: AppWorkOrder
paths:
  /api/app/v1/auth/login:
    post:
      tags:
      - AppAuth
      summary: Login with WeChat mini-program code
      operationId: appLogin
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WechatLoginRequest'
      responses:
        '200':
          description: Login success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppLoginResponseEnvelope'
        '400':
          description: Validation/domain request error
        '403':
          description: Permission or tenant access denied
        '409':
          description: State/idempotency/concurrency conflict
        '500':
          description: Unexpected system error
      x-alop-tenant-scoped: true
      x-alop-command: true
  /api/app/v1/me:
    get:
      tags:
      - AppProfile
      summary: Get current customer profile
      operationId: getMe
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppProfileEnvelope'
        '400':
          description: Validation/domain request error
        '403':
          description: Permission or tenant access denied
        '409':
          description: State/idempotency/concurrency conflict
        '500':
          description: Unexpected system error
      x-alop-tenant-scoped: true
  /api/app/v1/me/profile:
    put:
      tags:
      - AppProfile
      summary: Update current customer profile
      operationId: updateMe
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppProfileRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBase'
        '400':
          description: Validation/domain request error
        '403':
          description: Permission or tenant access denied
        '409':
          description: State/idempotency/concurrency conflict
        '500':
          description: Unexpected system error
      x-alop-tenant-scoped: true
      x-alop-command: true
  /api/app/v1/resources:
    get:
      tags:
      - AppResource
      summary: List rentable resources with paging and filters
      operationId: listAppResources
      parameters:
      - name: resourceType
        in: query
        schema:
          type: string
      - name: areaMin
        in: query
        schema:
          type: string
          pattern: ^\d+(\.\d{1,4})?$
      - name: areaMax
        in: query
        schema:
          type: string
          pattern: ^\d+(\.\d{1,4})?$
      - name: priceMin
        in: query
        schema:
          type: string
          pattern: ^\d+(\.\d{1,2})?$
      - name: priceMax
        in: query
        schema:
          type: string
          pattern: ^\d+(\.\d{1,2})?$
      - name: keyword
        in: query
        schema:
          type: string
      - name: pageNo
        in: query
        schema:
          type: integer
          minimum: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponseBase'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/AppResourceSummaryView'
        '400':
          description: Validation/domain request error
        '403':
          description: Permission or tenant access denied
        '409':
          description: State/idempotency/concurrency conflict
        '500':
          description: Unexpected system error
      x-alop-tenant-scoped: true
  /api/app/v1/resources/{resourceId}:
    get:
      tags:
      - AppResource
      summary: Get resource detail
      operationId: getAppResource
      parameters:
      - name: resourceId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppResourceDetailEnvelope'
        '400':
          description: Validation/domain request error
        '403':
          description: Permission or tenant access denied
        '409':
          description: State/idempotency/concurrency conflict
        '500':
          description: Unexpected system error
      x-alop-tenant-scoped: true
  /api/app/v1/viewings:
    post:
      tags:
      - AppViewing
      summary: Book a viewing appointment
      operationId: createViewing
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
