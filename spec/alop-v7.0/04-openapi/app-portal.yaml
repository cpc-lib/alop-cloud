components:
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
  schemas:
    ApiResponseBase:
      type: object
      required:
      - code
      - message
      - traceId
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
    WechatLoginRequest:
      type: object
      required:
      - code
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 256
          description: WeChat mini-program login code (wx.login).
        encryptedData:
          type: string
          description: Optional encrypted phone number payload from getPhoneNumber.
        iv:
          type: string
          description: IV paired with encryptedData.
        tenantCode:
          type: string
    AppLoginResponse:
      type: object
      required:
      - token
      - tokenType
      - expiresIn
      properties:
        token:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
        refreshToken:
          type: string
          nullable: true
        customerId:
          type: integer
          format: int64
        displayName:
          type: string
        phone:
          type: string
          nullable: true
        requiresProfile:
          type: boolean
          default: false
    AppLoginResponseEnvelope:
      allOf:
      - $ref: '#/components/schemas/ApiResponseBase'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/AppLoginResponse'
    AppProfileView:
      type: object
      required:
      - customerId
      - displayName
      properties:
        customerId:
          type: integer
          format: int64
        displayName:
          type: string
        phone:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        identityVerified:
          type: boolean
          default: false
    AppProfileEnvelope:
      allOf:
      - $ref: '#/components/schemas/ApiResponseBase'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/AppProfileView'
    UpdateAppProfileRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 128
        email:
          type: string
          format: email
        avatarUrl:
          type: string
          maxLength: 1024
    AppResourceSummaryView:
      type: object
      required:
      - resourceId
      - resourceName
      - resourceType
      properties:
        resourceId:
          type: integer
          format: int64
        resourceName:
          type: string
        resourceType:
          type: string
        coverImageUrl:
          type: string
          nullable: true
        chargeableArea:
          type: string
          pattern: ^\d+(\.\d{1,4})?$
          nullable: true
        listingPrice:
          type: string
          pattern: ^\d+(\.\d{1,2})?$
          nullable: true
        currency:
          type: string
          nullable: true
        available:
          type: boolean
    AppResourceDetailView:
      type: object
      required:
      - resourceId
      - resourceName
      - resourceType
      properties:
        resourceId:
          type: integer
          format: int64
        resourceName:
          type: string
        resourceType:
          type: string
        description:
          type: string
          nullable: true
        coverImageUrl:
          type: string
          nullable: true
        imageUrls:
          type: array
          items:
            type: string
        chargeableArea:
          type: string
          pattern: ^\d+(\.\d{1,4})?$
          nullable: true
        listingPrice:
          type: string
          pattern: ^\d+(\.\d{1,2})?$
          nullable: true
        currency:
          type: string
          nullable: true
        available:
          type: boolean
        attributes:
          type: object
          additionalProperties: true
    AppResourceDetailEnvelope:
      allOf:
      - $ref: '#/components/schemas/ApiResponseBase'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/AppResourceDetailView'
    CreateViewingRequest:
      type: object
      required:
      - resourceId
      - scheduledAt
      properties:
        resourceId:
          type: integer
          format: int64
        scheduledAt:
          type: string
          format: date-time
        name:
          type: string
          maxLength: 128
        phone:
          type: string
          maxLength: 32
        remark:
          type: string
          maxLength: 512
    ViewingView:
      type: object
      required:
      - viewingId
      - resourceId
      - scheduledAt
      - status
      properties:
        viewingId:
          type: integer
          format: int64
        resourceId:
          type: integer
          format: int64
        resourceName:
          type: string
        scheduledAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - PENDING
          - CONFIRMED
          - COMPLETED
          - CANCELLED
    AppQuotationItemView:
      type: object
      required:
      - resourceUnitId
      - startTime
      - endTime
      - unitPrice
      properties:
        resourceUnitId:
