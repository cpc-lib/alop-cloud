      tags:
      - AppNotification
      summary: Mark a notification as read
      operationId: markNotificationRead
      parameters:
      - name: notificationId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
